<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Aso Emmanuella</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="planner.html">Planner</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main>
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Send a Message</h2>
      <p>Fill in each field below.</p>

      <form id="contact-form" novalidate>
        <div class="form-field">
          <label for="contact-name">Name</label>
          <input
            id="contact-name"
            name="name"
            type="text"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-field">
          <label for="contact-email">Email Address</label>
          <input
            id="contact-email"
            name="email"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-field">
          <label for="contact-phone">Phone Number</label>
          <input
            id="contact-phone"
            name="phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            required
          >
        </div>

        <div class="form-field">
          <label for="contact-message-text">Message</label>
          <textarea
            id="contact-message-text"
            name="message"
            rows="6"
            required
          ></textarea>
        </div>

        <button type="submit">Submit Message</button>
        <p id="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 MIVA Open University. All rights reserved.</p>
  </footer>
</body>
</html>
